# System76 Power Management Configuration
# /etc/system76-power.conf — install with `sudo make install-config`
#
# Tuned for a Lenovo Legion Pro 5 (82WM): Ryzen 9 7945HX (55W HX-class,
# amd-pstate-epp), RTX 4070 Max-Q (AD106M) + Raphael iGPU, 2560x1600@240Hz eDP
# panel (also 60Hz; VRR-capable), 80Wh battery, ideapad_acpi conservation mode.
#
# Every key is optional; omitting one keeps the built-in default. Reload after
# editing (the active profile is re-applied immediately):
#     sudo kill -HUP $(pidof system76-power)
# Audit what actually took effect:
#     system76-power doctor


################################################################################
# AUTO-SWITCHING
################################################################################

[auto_switch]
# AC plugged  -> Balanced (240Hz, 55W/80W CPU) ; unplugged -> Battery (60Hz, 15W)
# A manual `system76-power profile <x>` suppresses this until the next AC change.
enabled = true


################################################################################
# REFRESH RATE SWITCHING (Profile-Based)
################################################################################

[refresh_rate]
# Applies on every profile change (manual or automatic). Never alters the
# resolution: only modes of the currently active resolution are considered.
enabled = true

# This panel exposes exactly 2560x1600@240 (preferred) and 2560x1600@60.
# 240Hz costs ~3-4W of panel power, which is irrelevant on AC but not on
# battery. Set `balanced = 60` instead if you prefer a cooler/quieter laptop on
# AC over smoothness.
battery = 60
balanced = 240
performance = 240


################################################################################
# DISPLAY MODE SWITCHING (AC-Based)
################################################################################

[display_modes]
# Left off: the panel stays at its native 2560x1600. Switching to a lower
# resolution saves ~2-3W on battery but looks soft on a native-1600 panel, so
# this machine keeps resolution and tunes refresh rate only.
#
# The keys below are INACTIVE while `enabled = false`; they document what this
# panel would be switched to if you turn the feature on.
enabled = false
ac_resolution = "2560x1600"
ac_refresh_rate = 240
battery_resolution = "2560x1600"
battery_refresh_rate = 60


################################################################################
# DEVICE POWER POLICIES
################################################################################

[profile]
# Do not touch screen/keyboard brightness on battery (opt-in). Set to `true` if
# you want the daemon to dim on battery; screen is capped at 10% and the
# keyboard backlight turned off.
dim_on_battery = false

# amdgpu panel power savings (ABM) on battery, 0 (off) to 4 (max): lowers the
# backlight while boosting contrast so the image looks about as bright. Costs
# some colour accuracy, so it is never used on balanced/performance. Ignored
# if the `amdgpu.abmlevel` kernel parameter is set.
battery_panel_power_savings = 3


[usb]
# Battery/balanced: autosuspend every USB device except the blacklists below.
# Performance: `on` (no autosuspend) for lowest input latency.
autosuspend = true

# Interface drivers never autosuspended. A device is excluded when any of its
# interfaces is bound to one of these (e.g. `5-1.1:1.0` -> btusb). Built-in
# default when unset: "usblp btusb usbhid" (printers, Bluetooth radios, mice and
# keyboards). Excluded devices are actively set to `on`, not just skipped.
blacklist_drivers = "usblp"

# Never autosuspend these devices:
#   048d:c103  ITE 8910 HID interface of the internal keyboard/lighting
#              - autosuspend causes input lag and stuck RGB effects on Legions
#   0489:e0d8  MediaTek MT7922 Bluetooth radio (btusb)
#              - can delay Bluetooth reconnect after idle
# The Chicony webcam (04f2:b7b6) and the Realtek/Genesys hubs stay autosuspended.
blacklist = "048d:c103 0489:e0d8"


[audio]
# HDA power-save: on for battery/balanced, cleared on performance (avoids
# audio start-up pops while gaming). This AMD box does not expose a
# power_save_controller knob, so only the device timeout is written.
power_save = true


[wifi]
# `iw` power-save on battery (wlan0 = MT7922), off on balanced/performance.
power_save = true


[pci]
# Runtime power management of PCI devices: on for battery/balanced, off for
# performance. Two devices (the RTX 4070 and the Raphael iGPU) manage their own
# PM, so they are never touched by the daemon: on battery/balanced via the
# driver blacklist below, on performance because GPUs (and the other functions
# of a GPU's slot, e.g. its HDMI audio) are always left alone there.
runtime_pm = true

# Drivers left out of the daemon's runtime-PM writes:
#   amdgpu nvidia nouveau radeon  GPU drivers run their own power management
#   nvme                          keeps both NVMe SSDs (CT480E100SSD8 + second
#                                 drive) out of aggressive low-power states
#   xhci_hcd                      USB controllers - avoids USB dropout/wake
#                                 latency on this chipset
# Remove `nvme`/`xhci_hcd` if you prefer the extra idle savings and have not
# seen disk hiccups or USB dropouts.
blacklist_drivers = "amdgpu nvidia nouveau radeon nvme xhci_hcd"


[radio]
# Left off on purpose: soft-blocking Bluetooth on battery would also cut a
# Bluetooth mouse/keyboard. Enable only if you never use BT peripherals.
# When enabled, the daemon blocks on battery and never unblocks automatically.
bluetooth_off_on_battery = false


[cpu]
# AMD SMU limits in milliwatts (Tctl in °C), applied through `ryzenadj` on AMD
# CPUs only. If `ryzenadj` is not installed, a warning is logged once. If it
# fails (unsupported SMU, missing ryzen_smu module, locked PCI config space),
# the rest of the profile still applies and the failure is reported as a
# profile error (e.g. by `system76-power profile battery`).
#
# Battery - quiet and efficient; the profile additionally caps the CPU at 60%
# frequency, disables boost and sets the EPP below. 15W sustained keeps the
# fans off; raise to 25W/35W/25W @75°C for more headroom, or use the built-in
# 12W/18W/10W @60°C for maximum runtime.
battery_stapm_mw = 15000
battery_fast_mw = 25000
battery_slow_mw = 15000
battery_tctl_c = 70

# Balanced and performance - stock HX-class envelope for this chassis
# (55W sustained, 80W boost). 95°C is the stock thermal ceiling; lower it to
# ~90°C if you prefer quieter fans at the cost of peak boost.
ac_stapm_mw = 55000
ac_fast_mw = 80000
ac_slow_mw = 80000
ac_tctl_c = 95

# Optional performance-only overrides. Each unset key uses its `ac_*` value, so
# by default performance and balanced share the envelope above.
# performance_stapm_mw = 65000
# performance_fast_mw = 90000
# performance_slow_mw = 90000
# performance_tctl_c = 95

# `energy_performance_preference` for the battery profile. This CPU advertises
# default/performance/balance_performance/balance_power/power/custom;
# `power` favours efficiency the most (slower to ramp up). Use
# `balance_power` if the battery profile feels sluggish.
battery_epp = "power"

################################################################################
# GRAPHICS SWITCHING
################################################################################

[graphics]
runtime_restart_dm = "auto"
